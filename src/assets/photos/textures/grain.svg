
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="180"
  height="180"
  viewBox="0 0 180 180"
>
  <filter id="grain">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.8"
      numOctaves="2"
      seed="12"
    />
    <feColorMatrix
      type="saturate"
      values="0"
    />
    <feComponentTransfer>
      <feFuncA
        type="table"
        tableValues="0 0.16"
      />
    </feComponentTransfer>
  </filter>

  <rect
    width="180"
    height="180"
    filter="url(#grain)"
    opacity="0.2"
  />
</svg>
